<!doctype html>
<meta charset="utf-8">
<title>Green Building sim (POC)</title>
<style>
  body { font: 16px system-ui; background: #0a0b10; color: #eee; margin: 0; display: grid; grid-template-columns: 22rem 1fr; height: 100vh; }
  aside { padding: 1.5rem; border-right: 1px solid #222; overflow: auto; }
  main { position: relative; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  code { display: block; background: #1a1c24; padding: .5rem; margin: .25rem 0 .75rem; word-break: break-all; white-space: pre-wrap; font-size: .8rem; }
  #status { color: #9a9; }
  button { font: inherit; padding: .4rem .7rem; margin-right: .5rem; background: #23262f; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<aside>
  <h1 id="name"></h1>
  <p id="status">connecting…</p>
  <p><button id="view">view: street</button><button id="toggle">hide connection info</button></p>
  <div id="conn">
    <p>Send URL</p><code id="send"></code>
    <p>curl (JSON, 17 rows × 9 × [r,g,b])</p><code id="curl"></code>
    <p>Python</p><code id="py"></code>
  </div>
</aside>
<main><canvas id="c"></canvas></main>
<script type="module">
  import { renderStreet, renderRiver, ROWS, COLS } from "./render.js";
  const $ = (id) => document.getElementById(id);
  const name = location.pathname.slice(1);
  $("name").textContent = name;
  const sendUrl = `${location.origin}/api/i/${name}/frame`;
  $("send").textContent = sendUrl;
  $("curl").textContent = `curl -X POST ${sendUrl} -H 'Content-Type: application/json' -d @frame.json`;
  $("py").textContent = `from gbsim import WebDisplay, Color\nd = WebDisplay("${name}", "${location.origin}/api")\nf = d.makeframe(); f[0][0] = Color(255,0,0); d.send(f)`;
  $("toggle").onclick = () => { const h = $("conn").style.display === "none"; $("conn").style.display = h ? "" : "none"; $("toggle").textContent = h ? "hide connection info" : "show connection info"; };

  let view = "street";
  $("view").onclick = () => { view = view === "street" ? "river" : "street"; $("view").textContent = `view: ${view}`; dirty = true; };

  const c = $("c"), ctx = c.getContext("2d");
  let W = 0, H = 0, dirty = true;
  const fit = () => { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; W = Math.round(r.width * d); H = Math.round(r.height * d); c.width = W; c.height = H; dirty = true; };
  addEventListener("resize", fit); fit();

  // Ring buffer of 3 frames; paint on rAF; latest-wins if behind.
  let frame = new Uint8Array(ROWS * COLS * 3);
  const ring = [];
  function paint() {
    if (ring.length) { frame = ring.shift(); dirty = true; }
    if (dirty) { (view === "street" ? renderStreet : renderRiver)(ctx, frame, W, H); dirty = false; }
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);

  function connect() {
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/i/${name}/view`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => $("status").textContent = "live";
    ws.onmessage = (e) => { ring.push(new Uint8Array(e.data)); if (ring.length > 3) ring.splice(0, ring.length - 1); };
    ws.onclose = () => { $("status").textContent = "reconnecting…"; setTimeout(connect, 1000); };
  }
  connect();
</script>
