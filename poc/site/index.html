<!doctype html>
<meta charset="utf-8">
<title>Green Building sim (POC)</title>
<style>
  body { font: 16px system-ui; background: #111; color: #eee; max-width: 32rem; margin: 4rem auto; }
  input, button { font: inherit; padding: .5rem; }
  section { margin-bottom: 2rem; }
</style>
<h1>Green Building sim <small>(POC)</small></h1>
<section>
  <h2>Create an instance</h2>
  <input id="pw" type="password" placeholder="event password">
  <button id="create">Create</button>
  <p id="out"></p>
</section>
<section id="demos" hidden>
  <h2>Demos</h2>
  <p>Pre-built animations playing on the simulator. No instance or password needed; add <code>?view=street</code> or <code>?view=river</code> for other angles.</p>
  <ul id="demolist"></ul>
</section>
<section>
  <h2>Watch an instance</h2>
  <input id="name" placeholder="curious-cat">
  <button id="watch">Watch</button>
</section>
<section>
  <h2>API docs</h2>
  <form method="post" action="/docs">
    <input name="password" type="password" placeholder="event password" autocomplete="off">
    <button>Open docs</button>
  </form>
  <p id="docsout"></p>
</section>
<script>
  create.onclick = async () => {
    const r = await fetch("/api/instances", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw.value }) });
    if (!r.ok) { out.textContent = "wrong password"; return; }
    const j = await r.json();
    location.href = j.view_url;
  };
  watch.onclick = () => { if (name.value) location.href = "/" + name.value.trim(); };
  fetch("/demos/demos.json").then((r) => r.ok ? r.json() : []).then((list) => {
    if (!list.length) return;
    for (const d of list) {
      const li = document.createElement("li"), a = document.createElement("a");
      a.href = "/demo/" + d.slug; a.textContent = d.title; li.append(a, " — " + d.description);
      demolist.append(li);
    }
    demos.hidden = false;
  }).catch(() => {});
  if (new URLSearchParams(location.search).get("docs") === "denied") docsout.textContent = "wrong password";
</script>
