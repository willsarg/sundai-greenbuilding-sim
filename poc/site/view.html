<!doctype html>
<meta charset="utf-8">
<title>Green Building sim (POC)</title>
<style>
  body { font: 16px system-ui; background: #0a0b10; color: #eee; margin: 0; display: grid; grid-template-columns: 22rem 1fr; height: 100vh; }
  aside { padding: 1.5rem; border-right: 1px solid #222; overflow: auto; }
  main { position: relative; }
  h1 { font-size: 2rem; margin: 0 0 .5rem; }
  code { display: block; background: #1a1c24; padding: .5rem; margin: .25rem 0 .75rem; word-break: break-all; white-space: pre-wrap; font-size: .8rem; }
  #status { color: #9a9; }
  button, select { font: inherit; padding: .4rem .7rem; margin-right: .5rem; background: #23262f; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<aside>
  <h1 id="name"></h1>
  <p id="status">connecting…</p>
  <p><label for="view">View</label>
    <select id="view">
      <option value="close">Close-up</option>
      <option value="street">Full building</option>
      <option value="river">Across the river</option>
    </select>
  </p>
  <p><button id="toggle">hide connection info</button></p>
  <div id="conn">
    <p>Send URL</p><code id="send"></code>
    <p>curl (JSON, 17 rows × 9 × [r,g,b])</p><code id="curl"></code>
    <p>Python</p><code id="py"></code>
  </div>
</aside>
<main><canvas id="c"></canvas></main>
<script type="module" src="/viewer.js"></script>
